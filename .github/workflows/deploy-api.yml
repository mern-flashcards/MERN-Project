

name: Deploy Backend

on:
  push:
    branches:
      - api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload backend
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            server/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/mern-api/server/

      - name: Build and restart backend
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd /opt/mern-api/server &&
            /home/deploy/.nvm/versions/node/v26.13.0/bin/npm ci &&
            /home/deploy/.nvm/versions/node/v26.13.0/bin/npm run build &&
            export XDG_RUNTIME_DIR=/run/user/$(id -u) &&
            systemctl --user restart cards-api &&
            systemctl --user is-active cards-api
          '

